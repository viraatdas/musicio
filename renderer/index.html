<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com;">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <title>Musicio</title>
</head>
<body>

  <!-- Loading Screen -->
  <div id="loading-screen">
    <div class="loading-content">
      <h1 class="glitch" data-text="MUSICIO">MUSICIO</h1>
      <p class="loading-sub">INITIALIZING AUDIO MATRIX</p>
      <div class="loading-bar">
        <div class="loading-bar-fill"></div>
      </div>
    </div>
    <div class="scanlines"></div>
  </div>

  <!-- App Shell -->
  <div id="app">
    <!-- Custom Titlebar -->
    <div id="titlebar">
      <div class="titlebar-drag">
        <span class="titlebar-title">MUSICIO</span>
      </div>
      <div class="titlebar-controls">
        <button id="btn-minimize" class="titlebar-btn" aria-label="Minimize">
          <svg width="12" height="12" viewBox="0 0 12 12"><rect y="5" width="12" height="2" fill="currentColor"/></svg>
        </button>
        <button id="btn-maximize" class="titlebar-btn" aria-label="Maximize">
          <svg width="12" height="12" viewBox="0 0 12 12"><rect x="1" y="1" width="10" height="10" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
        </button>
        <button id="btn-close" class="titlebar-btn btn-close" aria-label="Close">
          <svg width="12" height="12" viewBox="0 0 12 12"><path d="M1 1l10 10M11 1L1 11" stroke="currentColor" stroke-width="1.5"/></svg>
        </button>
      </div>
    </div>

    <!-- Sidebar -->
    <div id="sidebar">
      <button class="sidebar-btn active" data-service="spotify" title="Spotify">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
          <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381C8.88 5.88 15.78 6.12 20.16 8.88c.54.3.72 1.02.42 1.56-.3.42-1.02.6-1.499.24z"/>
        </svg>
        <span class="sidebar-tooltip">Spotify</span>
      </button>
      <button class="sidebar-btn" data-service="youtube" title="YouTube Music">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
          <path d="M12 0C5.376 0 0 5.376 0 12s5.376 12 12 12 12-5.376 12-12S18.624 0 12 0zm0 19.104c-3.924 0-7.104-3.18-7.104-7.104S8.076 4.896 12 4.896s7.104 3.18 7.104 7.104-3.18 7.104-7.104 7.104zm-1.2-4.104L15.6 12 10.8 8.904v6.096z"/>
        </svg>
        <span class="sidebar-tooltip">YouTube Music</span>
      </button>
      <button class="sidebar-btn" data-service="playlists" title="My Playlists">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
          <path d="M3 4h14v2H3V4zm0 4h14v2H3V8zm0 4h10v2H3v-2zm16-4v8.18c-.31-.11-.65-.18-1-.18-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3V10h2V8h-4z"/>
        </svg>
        <span class="sidebar-tooltip">My Playlists</span>
      </button>
      <div class="sidebar-divider"></div>
      <div class="sidebar-indicator"></div>
    </div>

    <!-- Webview Container -->
    <div id="webview-container">
      <webview
        id="webview-spotify"
        src="https://open.spotify.com"
        partition="persist:spotify"
        allowpopups
        class="webview active"
      ></webview>
      <webview
        id="webview-youtube"
        src="https://music.youtube.com"
        partition="persist:youtube"
        allowpopups
        class="webview"
      ></webview>

      <!-- Playlists View -->
      <div id="playlists-view" class="view-panel">
        <div class="playlists-header">
          <h2 class="playlists-title" data-text="MY PLAYLISTS">MY PLAYLISTS</h2>
          <button id="btn-new-playlist" class="neon-btn">+ NEW PLAYLIST</button>
        </div>

        <!-- New Playlist / Add Song Modal -->
        <div id="playlist-modal" class="modal hidden">
          <div class="modal-content">
            <div class="modal-header">
              <h3 id="modal-title">NEW PLAYLIST</h3>
              <button id="modal-close" class="modal-close-btn">&times;</button>
            </div>
            <div id="modal-body-create">
              <input type="text" id="input-playlist-name" class="neon-input" placeholder="Playlist name..." maxlength="60">
              <button id="btn-create-playlist" class="neon-btn">CREATE</button>
            </div>
            <div id="modal-body-add-song" class="hidden">
              <input type="text" id="input-song-title" class="neon-input" placeholder="Song title...">
              <input type="text" id="input-song-artist" class="neon-input" placeholder="Artist...">
              <input type="text" id="input-song-url" class="neon-input" placeholder="URL (optional)...">
              <div class="source-select">
                <button class="source-btn active" data-source="spotify">Spotify</button>
                <button class="source-btn" data-source="youtube">YouTube</button>
              </div>
              <button id="btn-add-song" class="neon-btn">ADD SONG</button>
            </div>
          </div>
        </div>

        <div id="playlists-grid" class="playlists-grid">
          <!-- Playlists rendered here by JS -->
        </div>

        <div id="playlists-empty" class="playlists-empty">
          <svg viewBox="0 0 24 24" width="64" height="64" fill="currentColor" opacity="0.2">
            <path d="M3 4h14v2H3V4zm0 4h14v2H3V8zm0 4h10v2H3v-2zm16-4v8.18c-.31-.11-.65-.18-1-.18-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3V10h2V8h-4z"/>
          </svg>
          <p>No playlists yet</p>
          <p class="dim">Create your first cross-platform playlist</p>
        </div>
      </div>
    </div>

    <div class="scanlines"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
