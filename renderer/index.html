<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com;">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <title>Musicio</title>
</head>
<body>

  <!-- Loading Screen -->
  <div id="loading-screen">
    <div class="loading-content">
      <h1 class="glitch" data-text="MUSICIO">MUSICIO</h1>
      <p class="loading-sub">INITIALIZING AUDIO MATRIX</p>
      <div class="loading-bar">
        <div class="loading-bar-fill"></div>
      </div>
    </div>
    <div class="scanlines"></div>
  </div>

  <!-- App Shell -->
  <div id="app">
    <!-- Custom Titlebar -->
    <div id="titlebar">
      <div class="titlebar-drag">
        <span class="titlebar-title">MUSICIO</span>
      </div>
      <div class="titlebar-controls">
        <button id="btn-minimize" class="titlebar-btn" aria-label="Minimize">
          <svg width="12" height="12" viewBox="0 0 12 12"><rect y="5" width="12" height="2" fill="currentColor"/></svg>
        </button>
        <button id="btn-maximize" class="titlebar-btn" aria-label="Maximize">
          <svg width="12" height="12" viewBox="0 0 12 12"><rect x="1" y="1" width="10" height="10" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
        </button>
        <button id="btn-close" class="titlebar-btn btn-close" aria-label="Close">
          <svg width="12" height="12" viewBox="0 0 12 12"><path d="M1 1l10 10M11 1L1 11" stroke="currentColor" stroke-width="1.5"/></svg>
        </button>
      </div>
    </div>

    <!-- Sidebar -->
    <div id="sidebar">
      <button class="sidebar-btn active" data-service="spotify" title="Spotify">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
          <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381C8.88 5.88 15.78 6.12 20.16 8.88c.54.3.72 1.02.42 1.56-.3.42-1.02.6-1.499.24z"/>
        </svg>
        <span class="sidebar-tooltip">Spotify</span>
      </button>
      <button class="sidebar-btn" data-service="youtube" title="YouTube Music">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
          <path d="M12 0C5.376 0 0 5.376 0 12s5.376 12 12 12 12-5.376 12-12S18.624 0 12 0zm0 19.104c-3.924 0-7.104-3.18-7.104-7.104S8.076 4.896 12 4.896s7.104 3.18 7.104 7.104-3.18 7.104-7.104 7.104zm-1.2-4.104L15.6 12 10.8 8.904v6.096z"/>
        </svg>
        <span class="sidebar-tooltip">YouTube Music</span>
      </button>
      <button class="sidebar-btn" data-service="blend" title="Daily Blend">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
          <path d="M18 4l-1.41 1.41L18.17 7H14.5C12 7 10 9 10 11.5S12 16 14.5 16h1.67l-1.58 1.59L16 19l4-4-4-4-1.41 1.41L16.17 14H14.5C13.12 14 12 12.88 12 11.5S13.12 9 14.5 9h3.67l-1.58 1.59L18 12l4-4-4-4zM6 9h4.5l-.86-1.2C9.26 7.28 8.66 7 8 7H6V5h2c1.22 0 2.36.55 3.13 1.5l1.59 2.22-1.22 1.71C10.78 11.45 9.64 12 8.42 12H6v-3zm0 5h2.42c.66 0 1.26-.28 1.64-.8l.86-1.2H6v2z"/>
        </svg>
        <span class="sidebar-tooltip">Daily Blend</span>
      </button>
      <div class="sidebar-divider"></div>
      <div class="sidebar-indicator"></div>
    </div>

    <!-- Webview Container -->
    <div id="webview-container">
      <webview
        id="webview-spotify"
        src="https://open.spotify.com"
        partition="persist:spotify"
        allowpopups
        class="webview active"
      ></webview>
      <webview
        id="webview-youtube"
        src="https://music.youtube.com"
        partition="persist:youtube"
        allowpopups
        class="webview"
      ></webview>

      <!-- Daily Blend View -->
      <div id="blend-view" class="view-panel">
        <div class="blend-header">
          <div class="blend-title-row">
            <h2 class="blend-title">DAILY BLEND</h2>
            <span id="blend-date" class="blend-date"></span>
          </div>
          <p class="blend-subtitle">Your cross-platform mix, refreshed daily</p>
          <div class="blend-actions">
            <button id="btn-capture" class="neon-btn capture-btn">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" style="vertical-align: -2px; margin-right: 6px;">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
              </svg>
              CAPTURE NOW PLAYING
            </button>
            <button id="btn-shuffle-blend" class="neon-btn shuffle-btn">SHUFFLE</button>
          </div>
        </div>

        <div id="blend-list" class="blend-list">
          <!-- Songs rendered by JS -->
        </div>

        <div id="blend-empty" class="blend-empty">
          <div class="blend-empty-icon">
            <svg viewBox="0 0 24 24" width="72" height="72" fill="currentColor">
              <path d="M18 4l-1.41 1.41L18.17 7H14.5C12 7 10 9 10 11.5S12 16 14.5 16h1.67l-1.58 1.59L16 19l4-4-4-4-1.41 1.41L16.17 14H14.5C13.12 14 12 12.88 12 11.5S13.12 9 14.5 9h3.67l-1.58 1.59L18 12l4-4-4-4zM6 9h4.5l-.86-1.2C9.26 7.28 8.66 7 8 7H6V5h2c1.22 0 2.36.55 3.13 1.5l1.59 2.22-1.22 1.71C10.78 11.45 9.64 12 8.42 12H6v-3zm0 5h2.42c.66 0 1.26-.28 1.64-.8l.86-1.2H6v2z"/>
            </svg>
          </div>
          <p class="blend-empty-title">Your blend is empty</p>
          <p class="blend-empty-sub">Play a song on Spotify or YouTube Music, then hit<br><strong>Capture Now Playing</strong> to add it to your daily blend</p>
        </div>
      </div>
    </div>

    <div class="scanlines"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
